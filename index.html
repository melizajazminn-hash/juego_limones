<!DOCTYPE html>
<html lang="es">
   
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atrapar Limones</title>
    
    <link rel="stylesheet" href="limones.css">
</head>

<body>

    <div class="contenedor">

        <h1>🍋 Atrapar Limones 🍋</h1>
<p> Creado por Meliza </p>
        <p>
            ¡Atrapa los limones antes de que lleguen al suelo!
        </p>

        <div class="informacion">

            <div>
                🏆 Puntaje:
                <span id="txtPuntaje">0</span>
            </div>

            <div>
                ❤️ Vidas:
                <span id="txtVidas">3</span>
            </div>

        </div>

        <canvas
            id="areaJuego"
            width="600"
            height="400">
        </canvas>

        <div class="controles">

            <button id="btnIzquierda">
                ◀ Izquierda
            </button>

            <button id="btnDerecha">
                Derecha ▶
            </button>

            <button id="btnReiniciar">
                🔄 Reiniciar
            </button>

        </div>

    </div>

    <script src="limones.js"></script>

</body>
</html>
